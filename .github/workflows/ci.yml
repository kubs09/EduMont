name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Lint
        run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
      - name: Install deps
        run: npm ci --prefix frontend
      - name: Test
        run: npm test --prefix frontend -- --watchAll=false
        env:
          CI: 'true'
      - name: Build
        run: npm run build --prefix frontend

  backend:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: montessori_test
      JWT_SECRET: ci-test-jwt-secret
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
      - name: Install deps
        run: npm ci --prefix backend
      - name: Create test database
        run: npm run test:db:create --prefix backend
      - name: Migrate test database
        run: npm run test:db:migrate --prefix backend
      - name: Test
        run: npm test --prefix backend

  migrate-production:
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: production-supabase-migrations
      cancel-in-progress: false
    needs: [lint, frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      USE_SUPABASE: 'true'
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_SSL: 'require'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
      - name: Install deps
        run: npm ci --prefix backend
      - name: Apply pending migrations to production
        run: npm run migrate --prefix backend
